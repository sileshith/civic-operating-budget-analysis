name: Validate portfolio
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Regenerate synthetic analysis
        run: python scripts/rebuild.py
      - name: Check calculations and constraints
        run: python scripts/test_model.py
      - name: Verify links and saved workbook
        run: python scripts/verify_release.py
      - name: Install report dependencies
        run: python -m pip install -r requirements-report.txt
      - name: Rebuild report
        run: python scripts/build_report.py
